<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join IRL Hide & Seek</title><link rel="stylesheet" href="/style.css"></head><body><main class="shell narrow">
<header class="top"><div class="brand"><div class="brand-mark">H/S</div><div><b>PLAYER ACCESS</b><small>IRL HIDE & SEEK</small></div></div></header>
<section class="hero"><p class="kicker">JOIN YOUR FRIENDS</p><h1>JOIN<span> GAME</span></h1><p>Enter your name and room code. You'll wait here until the host starts and randomly assigns roles.</p></section>
<section class="card"><label>Your name<input id="name" maxlength="24" placeholder="Your name"></label><label>Room code<input id="code" maxlength="6" placeholder="ABC123" autocapitalize="characters"></label><button id="join" class="primary">JOIN ROOM</button><p id="message" class="notice"></p></section></main>
<script>
const q=new URLSearchParams(location.search);if(q.get("room"))document.getElementById("code").value=q.get("room").toUpperCase();
document.getElementById("join").onclick=()=>{const name=document.getElementById("name").value.trim()||"Player";const code=document.getElementById("code").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){document.getElementById("message").textContent="Enter a six-character room code.";return;}sessionStorage.setItem("hs_name",name);sessionStorage.setItem("hs_room",code);sessionStorage.removeItem("hs_hostToken");location.href="/player.html?room="+code;};
</script></body></html>
